<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lummi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2B45; --ink-soft:#6b6480; --cream:#EFEAFB; --paper:#FBFAFC; --line:#D9D2EE;
  --violet:#8C7FEA; --violet-dark:#6656C9; --cyan:#5FE0E8; --cyan-dark:#2FB8C4;
  --font-display:'Fredoka',system-ui,sans-serif; --font-mono:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;
  background:var(--cream);color:var(--ink);font-family:var(--font-display);}
.card{width:100%;max-width:420px;text-align:center;}
h1{font-size:40px;margin:0;letter-spacing:-.5px;color:var(--violet);
  text-shadow:1px 1px 0 #796ADA,2px 2px 0 var(--violet-dark),3px 3px 0 #473D85;}
p.sub{margin:8px 0 28px;color:var(--ink-soft);font-family:var(--font-mono);
  font-size:11px;letter-spacing:2px;text-transform:uppercase;}
.links{display:flex;flex-direction:column;gap:12px;}
a.go{display:block;text-decoration:none;padding:18px;border-radius:12px;border:1.5px solid var(--ink);
  font-family:var(--font-mono);font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;}
a.escritorio{background:var(--violet);color:#fff;box-shadow:0 4px 0 var(--violet-dark);}
a.movil{background:var(--cyan);color:var(--ink);box-shadow:0 4px 0 var(--cyan-dark);}
a.go:active{transform:translateY(2px);box-shadow:none;}
a.go small{display:block;font-weight:700;font-size:10px;letter-spacing:.5px;
  text-transform:none;opacity:.85;margin-top:4px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Lummi</h1>
    <p class="sub">Elige cómo quieres jugar</p>
    <div class="links">
      <a class="go escritorio" href="lummi_app.html">Versión de escritorio<small>Pantallas grandes, dos columnas</small></a>
      <a class="go movil" href="lummi_app_movil.html">Versión móvil<small>Pensada para teléfono</small></a>
    </div>
  </div>
</body>
</html>
